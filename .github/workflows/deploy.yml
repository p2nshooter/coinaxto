name: Deploy axto-vault (tersembunyi)

# Tanpa route/domain, workers_dev=false. Kunci signer & kredensial PayPal hanya sebagai secret Cloudflare (terenkripsi).
on:
  push:
    branches: [main, ccr-9ef9a045-gmv4m2]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Global API Key (pemilik: „Pake CLOUDFLARE_API_KEY aja jgn token biar lebih luas“)
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test
      - run: npx wrangler r2 bucket create axto-vault-data 2>/dev/null || true
      - run: npx wrangler deploy
      - name: Rahasia
        run: |
          derive() { printf '%s' "axto:$1" | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_KEY" | awk '{print $NF}'; }
          printf '%s' "${VAULT_HMAC_KEY:-$(derive VAULT_HMAC_KEY)}" | npx wrangler secret put VAULT_HMAC_KEY >/dev/null
          [ -n "$SIGNER_KEY" ] && printf '%s' "$SIGNER_KEY" | npx wrangler secret put SIGNER_KEY >/dev/null || echo "::warning::SIGNER_KEY belum diisi (attestasi/voucher menunggu)"
          [ -n "$PAYPAL_CLIENT_ID" ] && printf '%s' "$PAYPAL_CLIENT_ID" | npx wrangler secret put PAYPAL_CLIENT_ID >/dev/null
          [ -n "$PAYPAL_CLIENT_SECRET" ] && printf '%s' "$PAYPAL_CLIENT_SECRET" | npx wrangler secret put PAYPAL_CLIENT_SECRET >/dev/null
          [ -n "$PAYPAL_WEBHOOK_ID" ] && printf '%s' "$PAYPAL_WEBHOOK_ID" | npx wrangler secret put PAYPAL_WEBHOOK_ID >/dev/null
          echo "rahasia vault siap"
        env:
          VAULT_HMAC_KEY: ${{ secrets.VAULT_HMAC_KEY }}
          SIGNER_KEY: ${{ secrets.SIGNER_KEY }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_LIVE_CLIENT_ID || secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_LIVE_CLIENT_SECRET || secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
      - name: Potret model (privat) → R2 axto-nft-data/model/
        run: |
          npx wrangler r2 bucket create axto-nft-data 2>/dev/null || true
          ls models/*/*.webp >/dev/null 2>&1 || { echo "tidak ada potret di repo (sudah di R2)"; exit 0; }
          for f in models/*/*.webp; do
            id=$(basename "$(dirname "$f")"); name=$(basename "$f")
            npx wrangler r2 object put "axto-nft-data/model/$id/$name" --file "$f" --content-type image/webp --remote >/dev/null
          done
          echo "Potret model diunggah: $(ls models/*/*.webp | wc -l) berkas" >> "$GITHUB_STEP_SUMMARY"
      - name: Pastikan tidak ada URL publik
        run: |
          grep -qx 'workers_dev = false' wrangler.toml && ! grep -q '^routes' wrangler.toml || { echo "::error::vault tidak boleh punya URL publik"; exit 1; }
          echo "## axto-vault aktif, tanpa URL publik ✅" >> "$GITHUB_STEP_SUMMARY"
